# SonarCloud (free for public repositories). The CI step runs once the SONAR_TOKEN secret exists.
sonar.organization=saqibrafiq
sonar.projectKey=Saqibrafiq_ecc-app
sonar.projectName=ECC App

sonar.sources=src
sonar.tests=src,e2e
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,e2e/**/*.spec.ts
sonar.exclusions=**/*.stories.tsx
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Route pages and layouts only compose features and are covered by the Playwright E2E tests,
# which report no line coverage. The logic they call (features/, shared/, domain/) counts.
sonar.coverage.exclusions=src/app/**/page.tsx,src/app/**/layout.tsx,src/app/**/loading.tsx,src/app/manifest.ts
